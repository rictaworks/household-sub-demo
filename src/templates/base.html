<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}くらしのていき便{% endblock %}</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="demo-banner">
    <i class="fa-solid fa-flask"></i> これはデモ版です。データはサーバー再起動時にリセットされる場合があります。
  </div>
  <header class="site-header">
    <div class="container">
      <a href="{{ url_for('index') }}" class="logo">
        <i class="fa-solid fa-box-open"></i> くらしのていき便
        <span class="badge-demo">DEMO</span>
      </a>
      <nav class="nav-links">
        <a href="{{ url_for('index') }}"><i class="fa-solid fa-store"></i> 商品一覧</a>
        <a href="{{ url_for('cart') }}" class="cart-link">
          <i class="fa-solid fa-cart-shopping"></i> カート
          {% if cart_count is defined and cart_count > 0 %}
            <span class="cart-badge">{{ cart_count }}</span>
          {% endif %}
        </a>
        <a href="{{ url_for('my_subs') }}"><i class="fa-solid fa-rotate"></i> マイサブスク</a>
        <a href="https://rictaworks.jp/#demos" class="back-link"><i class="fa-solid fa-arrow-left"></i> デモ一覧へ</a>
      </nav>
    </div>
  </header>

  <main class="container main-content">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>くらしのていき便 &mdash; デモ版</p>
    </div>
  </footer>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
